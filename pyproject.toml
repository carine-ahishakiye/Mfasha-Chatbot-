[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mfasha"
version = "0.1.0"
description = "MFASHA: a Kinyarwanda agriculture chatbot with text and voice support"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9", "pydantic>=2.6",
  "sqlalchemy>=2.0", "psycopg2-binary>=2.9", "numpy>=1.26", "scikit-learn>=1.4", "joblib>=1.3",
]

[project.optional-dependencies]
ml  = ["torch", "transformers>=4.40", "sentence-transformers>=3.0"]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["performance: latency budget checks (slower)"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "E731", "UP007", "UP045", "B008"]   # long lines are handled by the formatter; B008 is how FastAPI Depends works
