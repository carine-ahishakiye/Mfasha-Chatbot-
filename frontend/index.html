<!doctype html>
<!-- MFASHA welcome page: who are you? -->
<html lang="rw">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Mfasha igufasha gushaka amakuru ku buhinzi n’ubworozi mu Kinyarwanda.">
<meta name="theme-color" content="#F6F4EC">
<title>Mfasha – Murakaza neza</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232E7D32'/%3E%3Cpath d='M32 14c-8 8-8 20 0 30 8-10 8-22 0-30z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .w-page { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 20px; }
  .w-box { width: 100%; max-width: 520px; text-align: center; }
  .w-box svg.w-logo { width: 64px; height: 64px; }
  .w-box h1 { margin: 12px 0 4px; font-family: var(--serif); font-size: 2.1rem; font-weight: 500; }
  .w-box .w-sub { margin: 0 0 26px; color: var(--muted); }
  .w-opts { display: grid; gap: 14px; }
  .w-opt {
    display: flex; flex-direction: column; gap: 3px; align-items: flex-start; text-align: left;
    min-height: 84px; padding: 18px 20px; border: 1px solid var(--border); border-radius: 14px;
    background: var(--surface); color: var(--text);
  }
  .w-opt:hover { border-color: var(--primary); background: var(--primary-light); }
  .w-opt strong { font-size: 1.12rem; font-weight: 500; }
  .w-opt span { font-size: .9rem; color: var(--muted); }
  .w-foot { margin-top: 22px; font-size: .82rem; color: var(--faint); }
</style>
</head>
<body>
<noscript><p class="noscript">Mfasha ikenera JavaScript kugira ngo ikore.</p></noscript>
<main class="w-page">
  <div class="w-box">
    <svg class="w-logo" viewBox="0 0 120 120" aria-hidden="true"><use href="#logo-mark"/></svg>
    <h1 translate="no">Mfasha</h1>
    <p class="w-sub">Murakaza neza. Uri nde?</p>
    <div class="w-opts">
      <a class="w-opt" href="chat.html#chat">
        <strong>Ndi umuhinzi</strong>
        <span>Baza ibibazo ku buhinzi n’ubworozi. Nta kwiyandikisha bisabwa.</span>
      </a>
      <a class="w-opt" href="officer.html">
        <strong>Ndi umukozi w’ubuhinzi</strong>
        <span>Fungura konti cyangwa winjire kugira ngo usuzume ibisubizo.</span>
      </a>
    </div>
    <p class="w-foot">Mfasha isubiza gusa ibyemejwe n’abakozi b’ubuhinzi.</p>
  </div>
</main>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="logo-mark" viewBox="0 0 120 120">
      <clipPath id="lg-clip"><circle cx="58" cy="72" r="34"/></clipPath>
      <path d="M31 56a34 34 0 1 0 54 -10" fill="none" stroke="#1F6B35" stroke-width="7" stroke-linecap="round"/>

        <path d="M24 82q26-14 70-6v10q-42-8-70 8z" fill="#A4C42B"/>
        <path d="M30 98q24-22 64-14v26H30z" fill="#7FA51F"/>
      </g>
      <path d="M52 62C44 56 44 42 54 32c9 9 8 24-2 30z" fill="#1F6B35"/>
      <path d="M62 60C58 44 68 26 88 18c4 22-8 38-26 42z" fill="#1F6B35"/>
    </symbol>
  </defs>
</svg>
</body>
</html>
